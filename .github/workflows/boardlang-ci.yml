name: Boardlang CI (reusable)

# Validates, tests and checks the boardlang packages of a gameweave workspace.
#
# Called by this repo's ci.yml, and by other gameweave workspaces (the private
# gameweave/owned-games among them), pinned to a full commit SHA:
#
#   jobs:
#     boardlang:
#       uses: gameweave/games/.github/workflows/boardlang-ci.yml@<40-char sha>
#       permissions:
#         contents: read
#       with:
#         scope: ${{ github.event_name == 'pull_request' && 'changed' || 'all' }}
#
# The required status check is then `boardlang / Validate · Test · Check`.
#
# It runs against the CALLER's checkout, so the caller's repo must hold:
#   - gameweave.workspace.json
#   - package.json + package-lock.json, with `gameweave` an exact devDependency
#     (the toolchain is the caller's pin, never this workflow's)
#   - a `format:check` npm script
#   - .node-version
#
# It takes no secrets and needs none: every registry read it makes is public.
# Do not call it with `secrets: inherit`, and never hand it a publish token.

on:
  workflow_call:
    inputs:
      scope:
        description: >-
          'changed' checks the packages changed since the pull request's base
          branch, plus every package that depends on them (falls back to every
          package outside a pull request); 'all' checks every package.
        type: string
        required: false
        default: changed

permissions:
  contents: read

jobs:
  boardlang:
    name: Validate · Test · Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # --changed-since needs the merge base
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .gameweave/modules
          key: gameweave-modules-${{ hashFiles('**/boardlang.json') }}
          restore-keys: gameweave-modules-

      - name: Resolve scope
        id: scope
        env:
          SCOPE: ${{ inputs.scope }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          case "$SCOPE" in
            changed | all) ;;
            *)
              echo "::error::scope must be 'changed' or 'all', got '$SCOPE'"
              exit 1
              ;;
          esac
          # fetch-depth: 0 already fetched every branch, so origin/<base>
          # exists without a second fetch. A second fetch would also be
          # anonymous (persist-credentials: false), which a private caller's
          # repository refuses. If the ref is somehow missing, check
          # everything rather than less.
          if [ "$SCOPE" = changed ] && [ -n "$BASE_REF" ] &&
            git rev-parse --verify --quiet "origin/$BASE_REF" > /dev/null; then
            echo "selection=--changed-since=origin/$BASE_REF" >> "$GITHUB_OUTPUT"
          elif [ "$SCOPE" = changed ] && [ -n "$BASE_REF" ]; then
            echo "::warning::origin/$BASE_REF is not available; checking every package"
            echo "selection=--all" >> "$GITHUB_OUTPUT"
          else
            echo "selection=--all" >> "$GITHUB_OUTPUT"
          fi

      - name: gameweave validate
        env:
          SELECTION: ${{ steps.scope.outputs.selection }}
        run: npx gameweave validate "$SELECTION"

      - name: gameweave test
        env:
          SELECTION: ${{ steps.scope.outputs.selection }}
        run: npx gameweave test "$SELECTION"

      - name: gameweave check
        env:
          SELECTION: ${{ steps.scope.outputs.selection }}
        run: npx gameweave check "$SELECTION"

      - name: Formatting
        run: npm run format:check
